<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>PAGADIAN UTANG SYSTEM - PRO MAX</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F4C75">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="UTANG PRO">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',Arial}
body{background:linear-gradient(135deg,#e0f2f1,#f3e5f5);min-height:100vh}
.header{background:linear-gradient(135deg,#0F4C75 0%,#3282B8 50%,#00C853 100%);color:white;padding:22px 18px;display:flex;gap:14px;align-items:center;box-shadow:0 8px 32px rgba(15,76,117,.3);position:relative;overflow:hidden}
.logo{width:72px;height:72px;border-radius:50%;background:white;object-fit:cover;border:3px solid white;box-shadow:0 4px 15px rgba(0,0,0,.2);z-index:1}
.logo-fallback{width:72px;height:72px;border-radius:50%;background:white;color:#0F4C75;display:flex;align-items:center;justify-content:center;font-size:36px;border:3px solid white;box-shadow:0 4px 15px rgba(0,0,0,.2);z-index:1}
.gcash-badge{background:rgba(0,200,83,.9);padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:4px;margin-top:6px}
.card{background:rgba(255,255,255,.95);margin:14px;border-radius:20px;padding:16px;box-shadow:0 8px 32px rgba(0,0,0,.08);border:1px solid rgba(255,255,255,.5)}
.stats{display:flex;gap:10px;padding:0 14px}
.stat{flex:1;background:rgba(255,255,255,.95);padding:14px;border-radius:16px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.06);position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:4px}
.stat:nth-child(1)::before{background:linear-gradient(90deg,#0F4C75,#3282B8)}
.stat:nth-child(2)::before{background:linear-gradient(90deg,#00C853,#00E676)}
.stat:nth-child(3)::before{background:linear-gradient(90deg,#D32F2F,#FF5252)}
.form input{width:100%;padding:14px 16px;margin:6px 0;border:2px solid #e0e0e0;border-radius:12px;font-size:14px}
.btn{padding:14px;border:none;border-radius:12px;color:white;font-weight:700;width:100%;margin-top:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-add{background:linear-gradient(135deg,#0F4C75,#3282B8)}
.item{padding:14px 16px;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center}
.badge{padding:5px 10px;border-radius:20px;color:white;font-size:10px;font-weight:700}
.btn-bayad{background:linear-gradient(135deg,#00C853,#00E676);color:white;border:none;padding:8px 14px;border-radius:8px;cursor:pointer}
.btn-del{background:linear-gradient(135deg,#D32F2F,#FF5252);color:white;border:none;padding:8px 12px;border-radius:8px;cursor:pointer}
.gcash-box{background:linear-gradient(135deg,rgba(255,255,255,.98),rgba(232,245,233,.9));border:2px solid #00C853!important;border-radius:20px!important}
.qr{width:100px;height:100px;background:linear-gradient(135deg,#00C853,#00E676);border-radius:16px;color:white;display:flex;align-items:center;justify-content:center;flex-direction:column}
.install-banner{background:linear-gradient(135deg,#0F4C75,#00C853);color:white;padding:14px 16px;margin:14px;border-radius:16px;display:none;align-items:center;gap:12px;animation:slideDown .4s}
.install-banner.show{display:flex}
@keyframes slideDown{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}
</style>
</head>
<body>
<div id="installBanner" class="install-banner">
  <div style="width:48px;height:48px;background:white;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#0F4C75;font-size:28px"><i class="bi bi-phone"></i></div>
  <div style="flex:1"><b style="font-size:13px">I-Install ang UTANG PRO App</b><br><small style="font-size:11px;opacity:.9">Mas paspas, offline, naa sa home screen!</small></div>
  <button onclick="installPWA()" style="background:white;color:#0F4C75;border:none;padding:8px 14px;border-radius:10px;font-weight:700;font-size:12px">INSTALL</button>
  <button onclick="this.parentElement.classList.remove('show')" style="background:transparent;color:white;border:none;font-size:18px">×</button>
</div>
<div class="header">
  <img src="logo.png" class="logo" id="mainLogo" onerror="this.style.display='none';document.getElementById('fallbackLogo').style.display='flex'">
  <div id="fallbackLogo" class="logo-fallback" style="display:none"><i class="bi bi-shop"></i></div>
  <div class="header-text">
    <h3><i class="bi bi-shop"></i> PAGADIAN UTANG</h3>
    <h3 style="font-size:22px;margin-top:-4px">SYSTEM</h3>
    <small><i class="bi bi-patch-check-fill"></i> Verified Store System • PWA</small><br>
    <span class="gcash-badge"><i class="bi bi-wallet2"></i> GCash • Maya • Bank Accepted</span>
  </div>
</div>
<div class="card"><b style="font-size:13px;color:#0F4C75">TINDAHAN PROFILE</b> <input id="storeName" value="Tindahan ni phoebe -kagawasan, Pagadian City" style="font-weight:600;width:100%;margin-top:6px;padding:10px;border-radius:8px;border:2px solid #e0e0e0"><div style="margin-top:10px"><b style="font-size:11px;color:#666">GCASH NUMBER:</b></div><input id="gcashNum" type="tel" value="09072973901" style="color:#00C853;font-weight:700;border-color:#00C853;width:100%;padding:10px;border-radius:8px;border:2px solid" oninput="document.getElementById('gNum').innerText=this.value"></div>
<div class="stats"><div class="stat"><small>TOTAL UTANG</small><b id="tTotal" style="color:#0F4C75">P0</b></div><div class="stat"><small>COLLECTED</small><b id="tPaid" style="color:#00C853">P0</b></div><div class="stat"><small>BALANCE</small><b id="tBal" style="color:#D32F2F">P0</b></div></div>
<div class="card form"><b style="font-size:14px">Bag-ong Utang</b><input id="ngalan" placeholder="👤 Ngalan sa nangutang"><input id="pila" type="number" placeholder="💰 Pila"><input id="petsa" type="date"><button class="btn btn-add" type="button" onclick="addUtang()"><i class="bi bi-plus-circle-fill"></i> ADD UTANG KARON</button></div>
<div class="card" style="padding:0;overflow:hidden"><div style="background:linear-gradient(135deg,#0F4C75,#3282B8);color:white;padding:12px 16px"><b style="font-size:13px">LISTAHAN SA UTANG</b> <span style="margin-left:auto;background:rgba(255,255,255,.2);padding:3px 10px;border-radius:12px;font-size:10px" id="countBadge">0 ka tao</span></div><div id="lista"></div></div>
<div class="card gcash-box"><div style="display:flex;gap:14px;align-items:center"><div class="qr"><i class="bi bi-qr-code" style="font-size:38px"></i><b style="font-size:10px;margin-top:4px">GCash</b></div><div style="flex:1"><b style="font-size:14px">Salip Mohammad</b><br><b id="gNum" style="color:#00C853;font-size:16px">09072973901</b></div></div></div>
<script>
let utangs = JSON.parse(localStorage.getItem('utangPro')||'[]');
function render(){let t=0,p=0,h='';for(let i=0;i<utangs.length;i++){let u=utangs[i];t+=Number(u.pila);if(u.status=='PAID')p+=Number(u.pila);let badge=u.status=='PAID'?'<span class="badge" style="background:linear-gradient(135deg,#00C853,#00E676)">BAYAD NA</span>':'<span class="badge" style="background:linear-gradient(135deg,#FF9800,#FFC107);color:#333">PENDING</span>';let bg=u.status=='PAID'?'background:#E8F5E9':'';h+=`<div class="item" style="${bg}"><div style="flex:1"><b style="font-size:14px">${u.ngalan}</b> ${badge}<br><small style="color:#666">P${u.pila} • ${u.petsa}</small></div><div style="display:flex;gap:6px"><button type="button" onclick="bayad(${i})" class="btn-bayad">${u.status=='PAID'?'UNDO':'BAYAD'}</button><button type="button" onclick="del(${i})" class="btn-del"><i class="bi bi-trash3-fill"></i></button></div></div>`;}document.getElementById('lista').innerHTML=h||'<center style="padding:30px;color:#999"><small>Wala pay utang</small></center>';document.getElementById('tTotal').innerText='P'+t;document.getElementById('tPaid').innerText='P'+p;document.getElementById('tBal').innerText='P'+(t-p);document.getElementById('countBadge').innerText=utangs.length+' ka tao';localStorage.setItem('utangPro',JSON.stringify(utangs));}
function addUtang(){let n=document.getElementById('ngalan').value.trim();let p=document.getElementById('pila').value.trim();let d=document.getElementById('petsa').value;if(!n||!p){alert('⚠️ Butangi ngalan ug pila boss!');return;}utangs.unshift({ngalan:n,pila:p,petsa:d||new Date().toLocaleDateString(),status:'PENDING'});document.getElementById('ngalan').value='';document.getElementById('pila').value='';render();if(navigator.vibrate)navigator.vibrate(50);}
function bayad(i){utangs[i].status=utangs[i].status=='PAID'?'PENDING':'PAID';render();if(navigator.vibrate)navigator.vibrate(100);}
function del(i){if(confirm('Delete si '+utangs[i].ngalan+'?')){utangs.splice(i,1);render();}}
document.addEventListener('DOMContentLoaded',render);
let deferredPrompt;window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBanner').classList.add('show');});
function installPWA(){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then((choice)=>{if(choice.outcome==='accepted'){document.getElementById('installBanner').classList.remove('show');}deferredPrompt=null;});}else{alert('📲 Para ma-install:\nAndroid: 3 dots > Add to Home screen\niPhone: Share > Add to Home Screen');}}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
</script>
</body>
</html>
